<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Urgent</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%; overflow:hidden;}
body{background:grey; color:#fff; font-family:'Space Grotesk',sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px;}
.main-wrap{width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center;}

/* PROFILE */
.profile-border-wrap{position:relative; width:168px; height:168px; border-radius:50%; padding:3px; transition:transform 0.5s cubic-bezier(0.175,0.885,0.32,1.275), box-shadow 0.4s ease;}
.profile-border-wrap::before{content:''; position:absolute; inset:-3px; border-radius:50%; background:conic-gradient(from 0deg, #000, #fff, #888, #fff, #000); animation:rotateBorder 3s linear infinite; z-index:-1;}
.profile-border-wrap:hover{transform:scale(1.12); box-shadow:0 0 25px rgba(255,215,0,0.6), 0 0 60px rgba(255,215,0,0.25);}
@keyframes rotateBorder{to{transform:rotate(360deg);}}
.profile-img-box{width:100%; height:100%; border-radius:50%; overflow:hidden; background:#000; border:4px solid #0a0a0a;}
.profile-img-box img{width:100%; height:100%; object-fit:cover; display:block;}

/* NAMA - FINAL */
.name-shine{margin-top:32px; margin-bottom:28px; width:100%; text-align:center; display:block; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:38px; letter-spacing:-0.5px; line-height:1.1; background:linear-gradient(100deg, #111 25%, #fff 50%, #111 75%); background-size:200% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; animation:shineMove 2s linear infinite;}
@keyframes shineMove{to{background-position:200% center;}}

/* BUTTON */
.btn-kontak{margin-top:10px; padding:14px 36px; border-radius:100px; background:linear-gradient(180deg, #222 0%, #000 100%); border:1px solid rgba(255,255,255,0.15); color:#fff; font-weight:700; letter-spacing:1.2px; font-size:13px; cursor:pointer; text-transform:uppercase; transition:all 0.3s ease;}
.btn-kontak:hover{box-shadow:0 0 20px rgba(255,215,0,0.5); border-color:rgba(255,215,0,0.5); transform:translateY(-2px);}

/* POPUP */
#popupOverlay{position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(18px); z-index:100; display:none; opacity:0; align-items:center; justify-content:center; padding:20px; overflow:hidden;}
#popupOverlay.active{display:flex; opacity:1;}
.popup-box{width:100%; max-width:360px; background:#0e0e0e; border:1px solid rgba(255,255,255,0.1); border-radius:24px; padding:24px 0 20px; overflow:hidden;}
.popup-header{display:flex; justify-content:space-between; align-items:center; padding:0 24px 20px;}
.popup-header h2{font-size:16px; letter-spacing:1px;}
.close-btn{width:32px; height:32px; border-radius:50%; border:1px solid rgba(255,255,255,0.15); background:#1a1a1a; color:#fff; cursor:pointer; font-size:18px;}

/* CAROUSEL ENDLESS - HANYA HORIZONTAL */
.carousel-viewport{width:100%; overflow:hidden; touch-action:pan-x;}
.carousel-track{display:flex; width:100%; transition:transform 0.45s cubic-bezier(0.25,1,0.5,1); will-change:transform;}
.card-slide{min-width:100%; padding:0 20px; box-sizing:border-box;}

/* CARD + BORDER BERPUTAR */
.contact-card-wrap{position:relative; border-radius:20px; padding:2px; overflow:hidden; isolation:isolate;}
.contact-card-wrap::before{content:''; position:absolute; width:200%; height:200%; left:-50%; top:-50%; background:conic-gradient(from 0deg, #000 0deg, #fff 90deg, #666 180deg, #fff 270deg, #000 360deg); animation:rotateBorder 2.2s linear infinite; z-index:0;}
.contact-card-wrap:hover::before{background:conic-gradient(from 0deg, #001a00, #00ff88, #004d00, #2aff8a, #001a00); animation:rotateBorder 1s linear infinite;}
.contact-card{position:relative; z-index:1; background:linear-gradient(180deg, #1d1d1d 0%, #0a0a0a 100%); border-radius:18px; padding:22px; min-height:160px; display:flex; flex-direction:column; justify-content:center; gap:6px; cursor:pointer;}
.contact-card h3{font-size:18px; color:#fff;}
.contact-card p{font-size:13px; color:#9a9a9a;}
.dots{display:flex; gap:6px; justify-content:center; margin-top:18px;}
.dot{width:18px; height:4px; border-radius:10px; background:rgba(255,255,255,0.15); transition:all 0.3s;}
.dot.active{width:28px; background:#fff;}
</style>
</head>
<body>

<audio id="bgMusic" loop preload="auto">
  <source src="intro.opus" type="audio/mpeg">
</audio>

<div class="main-wrap">
  <div class="profile-border-wrap">
    <div class="profile-img-box"><img src="profil.png" alt="Karama"></div>
  </div>
  <h1 class="name-shine">Karama Panigoro</h1>
  <button class="btn-kontak" id="openPopup">Kontak Penting</button>
</div>

<div id="popupOverlay">
  <div class="popup-box">
    <div class="popup-header"><h2>Kontak</h2><button class="close-btn" id="closePopup">×</button></div>
    <div class="carousel-viewport" id="viewport"><div class="carousel-track" id="track"></div></div>
    <div class="dots" id="dots"></div>
  </div>
</div>

<script>
const contacts = [
  {nama:"A", telepon:"6281234567890", lokasi:"Boroko"},
  {nama:"B", telepon:"6281234567891", lokasi:"Manado"},
  {nama:"C", telepon:"6281234567892", lokasi:"Bintauna"},
  {nama:"D", telepon:"6281234567893", lokasi:"Tomohon"},
  {nama:"E", telepon:"6281234567894", lokasi:"Suwawa"},
  {nama:"F", telepon:"6281234567895", lokasi:"Gorontalo"},
  {nama:"G", telepon:"6281234567896", lokasi:"Minahasa"},
  {nama:"H", telepon:"6281234567897", lokasi:"Limboto"},
  {nama:"I", telepon:"6281234567898", lokasi:"Bahu"},
  {nama:"J", telepon:"112", lokasi:"Gorut"},
];
const track=document.getElementById('track');
const dots=document.getElementById('dots');
contacts.forEach((c,i)=>{
  const s=document.createElement('div'); s.className='card-slide';
  s.innerHTML=`<div class="contact-card-wrap"><div class="contact-card" data-wa="${c.telepon}"><h3>${c.nama}</h3><p>📞 ${c.telepon}</p><p>📍 ${c.lokasi}</p><p style="margin-top:10px; font-size:10px; letter-spacing:1px; color:#FFD700;">WhatsApp</p></div></div>`;
  track.appendChild(s);
  const d=document.createElement('div'); d.className='dot'+(i===0?' active':''); dots.appendChild(d);
});
let idx=0;
function update(){ track.style.transform=`translateX(-${idx*100}%)`; document.querySelectorAll('.dot').forEach((e,i)=> e.classList.toggle('active', i===idx)); }
function next(){ idx=(idx+1)%contacts.length; update(); }
function prev(){ idx=(idx-1+contacts.length)%contacts.length; update(); }
track.addEventListener('click', e=>{ const card=e.target.closest('.contact-card'); if(card){ const num=card.dataset.wa.replace(/\D/g,''); window.open(`https://wa.me/${num}`,'_blank'); } });
let startX=0, delta=0, isDrag=false;
const vp=document.getElementById('viewport');
vp.addEventListener('touchstart', e=>{ startX=e.touches[0].clientX; isDrag=true; track.style.transition='none'; }, {passive:true});
vp.addEventListener('touchmove', e=>{ if(!isDrag) return; delta=e.touches[0].clientX-startX; track.style.transform=`translateX(calc(-${idx*100}% + ${delta}px))`; }, {passive:true});
vp.addEventListener('touchend', ()=>{ track.style.transition='transform 0.45s cubic-bezier(0.25,1,0.5,1)'; if(Math.abs(delta)>50){ if(delta<0) next(); else prev(); } else update(); isDrag=false; delta=0; });
vp.addEventListener('mousedown', e=>{ startX=e.clientX; isDrag=true; track.style.transition='none'; });
window.addEventListener('mousemove', e=>{ if(!isDrag) return; delta=e.clientX-startX; track.style.transform=`translateX(calc(-${idx*100}% + ${delta}px))`; });
window.addEventListener('mouseup', ()=>{ if(!isDrag) return; track.style.transition='transform 0.45s cubic-bezier(0.25,1,0.5,1)'; if(Math.abs(delta)>50){ if(delta<0) next(); else prev(); } else update(); isDrag=false; delta=0; });
const overlay=document.getElementById('popupOverlay');
document.getElementById('openPopup').onclick=()=>{ overlay.style.display='flex'; setTimeout(()=> overlay.classList.add('active'),10); };
document.getElementById('closePopup').onclick=()=>{ overlay.classList.remove('active'); setTimeout(()=> overlay.style.display='none',400); };
overlay.addEventListener('click', e=>{ if(e.target===overlay){ overlay.classList.remove('active'); setTimeout(()=> overlay.style.display='none',400); } });
const music=document.getElementById('bgMusic');
function tryPlay(){ music.volume=1; music.play().catch(()=>{}); }
document.addEventListener('DOMContentLoaded', tryPlay);
document.body.addEventListener('click', tryPlay, {once:true});
document.body.addEventListener('touchstart', tryPlay, {once:true});
</script>
</body>
</html>
